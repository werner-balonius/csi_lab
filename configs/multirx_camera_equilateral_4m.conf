# 1Tx-2Rx equilateral 4 m geometry with synchronized OAK-D supervision.
# The triangle centroid is the origin; Node1--Node3 is the base.
# Private host/path settings remain in csi_lab.conf.
. "$SCRIPT_DIR/csi_lab.conf"

CAM_HOST="$RX_B"

CSI_CHANNEL="2462 20"
BATCH_GAP=25
LOCAL_VOICE_PROTOCOL=action_5_20_10
LOCAL_VOICE_ACTION=auto

LAYOUT_ID=multirx_camera_equilateral_4m_20260901
NODE1_XYZ_M="-2.000 1.154701 1.000"
NODE2_XYZ_M="0.000 -2.309401 1.000"
NODE3_XYZ_M="2.000 1.154701 1.000"
CAMERA_XYZ_M="2.000 1.154701 1.000"
CAMERA_ORIENTATION="co-located with node3; optical axis toward triangle centroid C (0,0,1.0), tilted down for full-body coverage"
LAYOUT_REFERENCE="docs/experiments/20260901_multirx_camera_plan.md"

